name: Build Linux

on:
  workflow_dispatch:

jobs:
  release:
    permissions: write-all
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [14.x]

    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      PYTHON_CACHE: ${{ github.workspace }}/.cache/python-2.7
      ADS_URLS: ${{ secrets.ADS_URLS }}
      VK_APP_ID: ${{ secrets.VK_APP_ID }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      API_ENDPOINT_URL: ${{ secrets.API_ENDPOINT_URL }}
      YANDEX_TRACKING_ID: ${{ secrets.YANDEX_TRACKING_ID }}
      STATIC_ENDPOINT_URL: ${{ secrets.STATIC_ENDPOINT_URL }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      EXT_API_SERVER: ${{ secrets.EXT_API_SERVER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache Python 2.7
        id: cache-python
        uses: actions/cache@v3
        with:
          path: ${{ env.PYTHON_CACHE }}
          key: ${{ runner.os }}-python-2.7.18
          restore-keys: |
            ${{ runner.os }}-python-2.7

      - name: Install Python 2.7 (if not cached)
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.PYTHON_CACHE }}
          cd ${{ env.PYTHON_CACHE }}
          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --enable-optimizations --prefix=${{ env.PYTHON_CACHE }}
          make
          make altinstall
          echo "${{ env.PYTHON_CACHE }}/bin" >> $GITHUB_PATH

      - name: Set up Python 2.7 symlink
        run: |
          sudo rm -f /usr/bin/python
          sudo ln -s ${{ env.PYTHON_CACHE }}/bin/python2.7 /usr/bin/python

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            elfutils \
            software-properties-common \
            flatpak-builder \
            flatpak

      - name: Setup Flatpak with current runtimes
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # Install current stable runtimes instead of EOL versions
          sudo flatpak install -y \
            org.freedesktop.Platform//22.08 \
            org.freedesktop.Sdk//22.08 \
            org.electronjs.Electron2.BaseApp/x86_64/stable
          
          # Only install additional architectures if needed
          sudo flatpak install -y \
            org.freedesktop.Platform/aarch64/22.08 \
            org.freedesktop.Platform/x86_64/22.08 \
            org.freedesktop.Sdk/x86_64/22.08

      - name: Cache Electron and dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ~/.cache/yarn
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-electron-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-electron-

      - name: Install project dependencies
        run: yarn install --frozen-lockfile --ignore-platform --ignore-engines

      - name: Build application
        run: DEBUG=electron-builder yarn run release:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-artifacts
          path: |
            release/*.snap
            release/*.AppImage
            release/linux-*-unpacked
          retention-days: 5
